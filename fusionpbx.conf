UserParameter=fusionpbx.extensions.total, export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "select count(*) as cnt  from v_extensions ex join v_domains vd on ex.domain_uuid = vd.domain_uuid where ex.enabled = 'true' and vd.domain_enabled = 'true'" -t
UserParameter=fusionpbx.call_center_callbacks.pending, export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "select count(ccc.call_center_callback_uuid) as count  from v_call_center_callbacks ccc join v_domains vd on ccc.domain_uuid = vd.domain_uuid where ccc.callback_status IN ('waiting','trying') and vd.domain_enabled = 'true'" -t
UserParameter=fusionpbx.message_queue.total, export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "select count(mq.message_queue_uuid) as count  from v_message_queue mq" -t
UserParameter=fusionpbx.voicemail.count[*], export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "select count(vmm.voicemail_message_uuid) as count  from v_voicemail_messages vmm WHERE voicemail_uuid = '$1'" -t
UserParameter=fusionpbx.voicemail.largemailboxes[*], export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "with large_voicemail_boxes as (select count(vvm.voicemail_message_uuid) from v_voicemail_messages vvm group by vvm.voicemail_uuid having count(vvm.voicemail_message_uuid) > $1) select count(*) from large_voicemail_boxes" -t
UserParameter=fusionpbx.voicemail.unread[*], export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "select count(vmm.voicemail_message_uuid) as count from v_voicemail_messages vmm WHERE voicemail_uuid = '$1' and (vmm.message_status is null or vmm.message_status = '')" -t
UserParameter=fusionpbx.fax_queue.total, export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "select count(fq.fax_queue_uuid) as count  from v_fax_queue fq where fax_status IN ('waiting','trying','sending')" -t
UserParameter=fusionpbx.email_queue.failed, export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "select count(*) from (select * from v_email_queue order by email_date desc limit 100) as eq where eq.email_status = 'failed'" -t
UserParameter=fusionpbx.email_queue.waiting, export PGPASSWORD="`grep database.0.password /etc/fusionpbx/config.conf | awk {'print $3'}`"; psql postgresql://fusionpbx:`echo $PGPASSWORD`@localhost:5432/fusionpbx -A -c "SELECT COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(email_date))),0) FROM v_email_queue WHERE email_status='waiting'" -t
UserParameter=fusionpbx.restore.status,cut -d'|' -f1 /var/log/fusionpbx_restore_status
UserParameter=fusionpbx.restore.message,cut -d'|' -f2- /var/log/fusionpbx_restore_status

# Domain Discovery Rule (Filters out administratively disabled domains)
UserParameter=fusionpbx.domains.discovery,export PGPASSWORD=`sed -n 's/.*database.0.password.*= *//p' /etc/fusionpbx/config.conf | tr -d '"'\'' '`; psql -h localhost -U fusionpbx -d fusionpbx -t -c "SELECT json_strip_nulls(json_build_object('data', json_agg(json_build_object('{#DOMAINNAME}', domain_name)))) FROM v_domains WHERE domain_enabled = 'true';"
# 1. Active Extensions Count (Counts only enabled, billable licenses)
UserParameter=fusionpbx.domain.limits.extensions.active_extensions[*],export PGPASSWORD=`sed -n 's/.*database.0.password.*= *//p' /etc/fusionpbx/config.conf | tr -d '"'\'' '`; psql -h localhost -U fusionpbx -d fusionpbx -t -A -c "SELECT COALESCE((SELECT count(*)::text FROM v_extensions WHERE domain_uuid = (SELECT domain_uuid FROM v_domains WHERE domain_name = '$1') AND enabled = 'true'), '0');"
# 2. Check if Limit is Configured (Returns 1 or 0)
UserParameter=fusionpbx.domain.limits.extensions.has_limit[*],export PGPASSWORD=`sed -n 's/.*database.0.password.*= *//p' /etc/fusionpbx/config.conf | tr -d '"'\'' '`; psql -h localhost -U fusionpbx -d fusionpbx -t -A -c "SELECT COALESCE((SELECT case when (SELECT domain_setting_value FROM v_domain_settings WHERE domain_uuid = (SELECT domain_uuid FROM v_domains WHERE domain_name = '$1') AND domain_setting_subcategory = 'extensions' AND domain_setting_enabled = 'true' LIMIT 1) IS NOT NULL then '1' else '0' end), '0');"
# 3. Check if Enabled Extensions Exceed the Limit (Compares active extensions against the ceiling)
UserParameter=fusionpbx.domain.limits.extensions.over_limit[*],export PGPASSWORD=`sed -n 's/.*database.0.password.*= *//p' /etc/fusionpbx/config.conf | tr -d '"'\'' '`; psql -h localhost -U fusionpbx -d fusionpbx -t -A -c "SELECT COALESCE((SELECT case when (SELECT count(*) FROM v_extensions WHERE domain_uuid = (SELECT domain_uuid FROM v_domains WHERE domain_name = '$1') AND enabled = 'true') > COALESCE((SELECT domain_setting_value FROM v_domain_settings WHERE domain_uuid = (SELECT domain_uuid FROM v_domains WHERE domain_name = '$1') AND domain_setting_subcategory = 'extensions' AND domain_setting_enabled = 'true' LIMIT 1)::integer, 99999) then '1' else '0' end), '0');"


